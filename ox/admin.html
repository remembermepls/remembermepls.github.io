<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OX 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
main{flex:1;padding:24px max(16px,4vw) 48px;width:100%;max-width:1200px;margin:0 auto}
.login{max-width:420px;margin:10vh auto 0;display:grid;gap:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:20px}
.panel h3{margin:0 0 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3 small{color:var(--muted);font-weight:400;font-size:13px}
.panel .field{background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;color:var(--muted)}
.pill.on{border-color:var(--mint);color:var(--mint)}
.pill.warn{border-color:var(--pink);color:var(--pink)}
.cur{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.cur .t{font-weight:700;font-size:18px;word-break:keep-all;overflow-wrap:anywhere}
.cur .m{color:var(--muted);font-size:13px;margin-top:6px}
.big-num{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.big-num div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.big-num b{display:block;font:900 28px var(--display);line-height:1.2}
.big-num span{color:var(--muted);font-size:12px}
.o-c{color:var(--mint)} .x-c{color:var(--pink)}
.ctrl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ctrl .btn{padding:10px 12px;font-size:14px}
.add{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.add .field{padding:10px 14px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:10px 16px;font:900 18px var(--display)}
.seg input:checked + span.o-c{background:rgba(8,253,216,.15)}
.seg input:checked + span.x-c{background:rgba(253,33,85,.15)}
.seg input:focus-visible + span{outline:2px solid var(--mint);outline-offset:-2px}
details{margin-top:12px;color:var(--muted);font-size:14px}
details textarea{margin-top:8px;min-height:110px;resize:vertical;font-size:14px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.list li.used{opacity:.55}
.list li.now{border-color:var(--mint);opacity:1}
.list .n{color:var(--muted);font-size:13px;width:22px;flex:none}
.list .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.list .ans{font:900 18px var(--display);width:18px;text-align:center;flex:none}
.list .tag{font-size:12px;color:var(--muted);flex:none}
.icon{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;flex:none}
.icon:hover{color:var(--pink)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px}
.person.out{opacity:.4;text-decoration:line-through}
.person .a{font:900 13px var(--display)}
.person .icon{padding:0 4px}
.empty{color:var(--muted);font-size:14px;margin:0}
.link{font-size:13px;color:var(--muted);word-break:break-all}
.link a{color:var(--mint)}
</style>
</head>
<body>
<header>
  <h1>OX<span>관리자</span></h1>
  <span class="me" id="who"></span>
</header>
<main id="main"></main>

<script type="module">
import { configured, R, serverNow, esc, store, SETUP_HTML } from "./common.js";
import { onValue, get, set, update, push, remove, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $main = document.getElementById("main");
const KEY = "ox_admin_key";
let bankKey = store.get(KEY);
let game = null, players = {}, bank = {}, answers = {}, answersPath = null;
let busy = false;

if (!configured) $main.innerHTML = `<div style="max-width:520px;margin:10vh auto 0">${SETUP_HTML}</div>`;
else if (!bankKey) showLogin();
else start();

function showLogin() {
  $main.innerHTML = `
    <form class="login" id="login">
      <div class="intro"><p class="big">🔐</p><h2>관리자 입장</h2>
      <p>문제은행 비밀번호를 입력하세요.<br>처음이면 새로 정할 비밀번호를 입력하면 돼요.<br>다른 기기에서도 같은 비밀번호로 같은 문제를 불러와요.</p></div>
      <input class="field" id="pw" type="password" minlength="6" placeholder="비밀번호 (6자 이상)" required autocomplete="current-password">
      <button class="btn">들어가기</button>
    </form>`;
  document.getElementById("pw").focus();
  document.getElementById("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    if (pw.length < 6) return;
    // 비밀번호 자체는 저장하지 않고, 해시값을 문제은행 주소로 쓴다
    const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ox-quiz:" + pw));
    bankKey = "k_" + Array.from(new Uint8Array(hash), (b) => b.toString(16).padStart(2, "0")).join("");
    store.set(KEY, bankKey);
    start();
  });
}

function start() {
  $main.innerHTML = `
    <div class="grid">
      <div>
        <section class="panel">
          <h3>진행 <small id="link"></small></h3>
          <div class="status" id="status"></div>
          <div id="current"></div>
          <div class="big-num" id="nums"></div>
          <div class="row" style="margin-bottom:12px">
            <label for="dur" style="color:var(--muted);font-size:14px">제한시간</label>
            <select class="field" id="dur" style="width:auto;padding:8px 12px">
              <option value="0">없음</option><option value="10">10초</option><option value="15">15초</option>
              <option value="20" selected>20초</option><option value="30">30초</option><option value="60">60초</option>
            </select>
          </div>
          <div class="ctrl" id="ctrl"></div>
        </section>
        <section class="panel">
          <h3>참가자 <small id="pcount"></small></h3>
          <div id="people"></div>
        </section>
      </div>
      <div>
        <section class="panel">
          <h3>문제은행 <small id="bcount"></small></h3>
          <form class="add" id="add">
            <input class="field" id="qtext" placeholder="문제를 입력하세요" required maxlength="200">
            <div class="seg" role="radiogroup" aria-label="정답">
              <label><input type="radio" name="ans" value="O" checked><span class="o-c">O</span></label>
              <label><input type="radio" name="ans" value="X"><span class="x-c">X</span></label>
            </div>
            <button class="btn sm">추가</button>
          </form>
          <details>
            <summary>여러 문제 한꺼번에 추가</summary>
            <p style="margin:8px 0 0">한 줄에 한 문제씩, 맨 끝에 <code>O</code> 또는 <code>X</code>를 붙이세요. 예) <code>지구는 둥글다 O</code></p>
            <textarea class="field" id="bulk" placeholder="고래는 포유류다 O&#10;토마토는 과일이 아니다 X"></textarea>
            <div class="row" style="margin-top:8px"><button class="btn sm" id="bulkBtn" type="button">모두 추가</button><span id="bulkMsg"></span></div>
          </details>
          <ul class="list" id="bank" style="margin-top:16px"></ul>
        </section>
        <p class="link"><button class="btn ghost sm" id="logout" type="button">비밀번호 바꾸기</button></p>
      </div>
    </div>`;

  const userUrl = new URL("./", location.href).href;
  document.getElementById("link").innerHTML = `참가 주소 <a href="${esc(userUrl)}" target="_blank" rel="noopener">${esc(userUrl)}</a>`;

  document.getElementById("add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const t = document.getElementById("qtext");
    const text = t.value.trim();
    const answer = document.querySelector('input[name="ans"]:checked').value;
    if (!text) return;
    await push(R(`banks/${bankKey}/q`), { text, answer, at: serverNow() });
    t.value = ""; t.focus();
  });
  document.getElementById("bulkBtn").addEventListener("click", async () => {
    const lines = document.getElementById("bulk").value.split("\n").map((l) => l.trim()).filter(Boolean);
    const updates = {}; let ok = 0; const bad = [];
    lines.forEach((l, i) => {
      const m = l.match(/^(.+?)\s*[\s|,/]\s*([OoXx○×])$/);
      if (!m) { bad.push(i + 1); return; }
      const a = /[Oo○]/.test(m[2]) ? "O" : "X";
      updates[push(R(`banks/${bankKey}/q`)).key] = { text: m[1].trim(), answer: a, at: serverNow() + i };
      ok++;
    });
    if (ok) await update(R(`banks/${bankKey}/q`), updates);
    document.getElementById("bulkMsg").textContent = `${ok}개 추가` + (bad.length ? ` · ${bad.join(", ")}번째 줄은 형식이 맞지 않아요` : "");
    if (!bad.length) document.getElementById("bulk").value = "";
  });
  document.getElementById("logout").addEventListener("click", () => { store.del(KEY); location.reload(); });

  $main.addEventListener("click", onClick);

  onValue(R(`banks/${bankKey}/q`), (s) => { bank = s.val() || {}; renderBank(); renderGame(); });
  onValue(R("players"), (s) => { players = s.val() || {}; renderPeople(); renderGame(); });
  onValue(R("game"), async (s) => {
    game = s.val();
    if (!game || !game.gameId) { await set(R("game"), freshGame()); return; }
    watchAnswers(); renderGame(); renderBank(); renderPeople();
  });
  setInterval(tick, 250);
}

const freshGame = () => ({ gameId: Date.now().toString(36), status: "lobby", locked: false, round: 0, deadline: 0, duration: 0 });

function watchAnswers() {
  const p = game?.rkey ? `answers/${game.rkey}` : null;
  if (p === answersPath) return;
  if (answersPath) off(R(answersPath));
  answersPath = p; answers = {};
  if (p) onValue(R(p), (s) => { answers = s.val() || {}; renderGame(); renderPeople(); });
}

const sortedBank = () => Object.entries(bank).map(([id, q]) => ({ id, ...q })).sort((a, b) => (a.at || 0) - (b.at || 0));
const plist = () => Object.entries(players).map(([id, p]) => ({ id, ...p }));
const alivePlayers = () => plist().filter((p) => p.alive);
const STATUS = { lobby: "대기 중", question: "문제 진행 중", closed: "마감 · 채점 전", reveal: "정답 공개됨", ended: "게임 종료" };

function renderGame() {
  if (!game) return;
  const g = game;
  const alive = alivePlayers();
  document.getElementById("who").textContent = `R${g.round || 0} · ${STATUS[g.status] || ""}`;
  document.getElementById("status").innerHTML = `
    <span class="pill on">${STATUS[g.status] || g.status}</span>
    <span class="pill">ROUND ${g.round || 0}</span>
    <span class="pill ${g.locked ? "warn" : "on"}">${g.locked ? "입장 잠김" : "입장 가능"}</span>`;

  const q = g.qid ? bank[g.qid] : null;
  document.getElementById("current").innerHTML = g.text ? `
    <div class="cur">
      <div class="t">${esc(g.text)}</div>
      <div class="m">정답 <b class="${q?.answer === "O" ? "o-c" : "x-c"}">${esc(q?.answer ?? "?")}</b>
      <span id="left"></span></div>
    </div>` : `<div class="cur"><div class="m">오른쪽 문제은행에서 <b>출제</b>를 누르면 모든 생존자 화면에 문제가 떠요. 첫 문제를 내면 입장이 자동으로 잠겨요.</div></div>`;

  const answered = alive.filter((p) => answers[p.id]);
  const o = answered.filter((p) => answers[p.id] === "O").length;
  const x = answered.length - o;
  const inRound = g.status === "question" || g.status === "closed";
  document.getElementById("nums").innerHTML = `
    <div><b>${alive.length}</b><span>생존</span></div>
    <div><b>${inRound ? `${answered.length}` : "–"}</b><span>응답</span></div>
    <div><b class="o-c">${inRound ? o : g.stats?.o ?? "–"}</b><span>O</span></div>
    <div><b class="x-c">${inRound ? x : g.stats?.x ?? "–"}</b><span>X</span></div>`;

  const s = g.status;
  const outThisRound = plist().filter((p) => !p.alive && p.outRound === g.round).length;
  document.getElementById("ctrl").innerHTML = `
    <button class="btn" data-act="close" ${s === "question" ? "" : "disabled"}>지금 마감</button>
    <button class="btn mint" data-act="reveal" ${s === "closed" || s === "question" ? "" : "disabled"}>정답 공개 · 채점</button>
    <button class="btn ghost" data-act="revive" ${s === "reveal" && outThisRound ? "" : "disabled"}>이번 탈락자 부활 (${outThisRound})</button>
    <button class="btn ghost" data-act="lock" ${s === "ended" ? "disabled" : ""}>${g.locked ? "입장 다시 허용" : "입장 잠그기"}</button>
    <button class="btn ghost" data-act="end" ${s === "lobby" || s === "reveal" ? "" : "disabled"}>게임 종료 · 우승 발표</button>
    <button class="btn ghost" data-act="new">새 게임 (모두 부활)</button>
    <button class="btn ghost" data-act="clear">참가자 전체 삭제</button>`;
  tick();
}

function renderBank() {
  const list = sortedBank();
  const el = document.getElementById("bank");
  if (!el) return;
  document.getElementById("bcount").textContent = `${list.length}문제`;
  const canAsk = game && (game.status === "lobby" || game.status === "reveal");
  el.innerHTML = list.length ? list.map((q, i) => {
    const used = q.usedIn === game?.gameId;
    const now = game?.qid === q.id && game?.status !== "lobby";
    return `<li class="${used ? "used" : ""} ${now ? "now" : ""}">
      <span class="n">${i + 1}</span>
      <span class="txt">${esc(q.text)}</span>
      <span class="ans ${q.answer === "O" ? "o-c" : "x-c"}">${esc(q.answer)}</span>
      ${used ? `<span class="tag">R${q.usedRound}</span>` : ""}
      <button class="btn sm ${used ? "ghost" : ""}" data-ask="${esc(q.id)}" ${canAsk ? "" : "disabled"}>출제</button>
      <button class="icon" data-delq="${esc(q.id)}" aria-label="삭제" title="삭제">✕</button>
    </li>`;
  }).join("") : `<p class="empty">아직 문제가 없어요. 위에서 문제를 추가하세요.</p>`;
}

function renderPeople() {
  const el = document.getElementById("people");
  if (!el || !game) return;
  const list = plist().sort((a, b) => (b.alive - a.alive) || a.name.localeCompare(b.name, "ko"));
  const alive = list.filter((p) => p.alive).length;
  document.getElementById("pcount").textContent = `생존 ${alive} / 전체 ${list.length}`;
  const showAns = game.status === "question" || game.status === "closed";
  el.innerHTML = list.length ? `<div class="people">${list.map((p) => {
    const a = showAns && p.alive ? answers[p.id] : null;
    return `<span class="person ${p.alive ? "" : "out"}">${esc(p.name)}
      ${a ? `<span class="a ${a === "O" ? "o-c" : "x-c"}">${a}</span>` : showAns && p.alive ? `<span class="a" style="color:var(--muted)">…</span>` : ""}
      <button class="icon" data-kick="${esc(p.id)}" aria-label="${esc(p.name)} 내보내기" title="내보내기">✕</button></span>`;
  }).join("")}</div>` : `<p class="empty">아직 입장한 사람이 없어요. 참가 주소를 공유하세요.</p>`;
}

function tick() {
  const el = document.getElementById("left");
  if (!game || game.status !== "question") { if (el) el.textContent = ""; return; }
  if (!game.deadline) { if (el) el.textContent = " · 제한시간 없음"; return; }
  const left = game.deadline - serverNow();
  if (el) el.textContent = left > 0 ? ` · 남은 시간 ${Math.ceil(left / 1000)}초` : " · 시간 종료";
  // 제한시간이 끝나고 늦게 도착한 답까지 받은 뒤 자동 마감
  if (left < -1500 && !busy) act("close");
}

async function onClick(e) {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.ask) return ask(b.dataset.ask);
  if (b.dataset.delq) {
    if (confirm(`"${bank[b.dataset.delq]?.text}" 문제를 삭제할까요?`)) await remove(R(`banks/${bankKey}/q/${b.dataset.delq}`));
    return;
  }
  if (b.dataset.kick) {
    const p = players[b.dataset.kick];
    if (p && confirm(`${p.name}님을 내보낼까요? 같은 이름으로 다시 들어오려면 입장이 허용되어 있어야 해요.`)) await remove(R(`players/${b.dataset.kick}`));
    return;
  }
  if (b.dataset.act) act(b.dataset.act);
}

async function ask(qid) {
  const q = bank[qid];
  if (!q || busy) return;
  if (q.usedIn === game.gameId && !confirm("이번 게임에서 이미 낸 문제예요. 다시 낼까요?")) return;
  if (!alivePlayers().length && !confirm("생존자가 없어요. 그래도 출제할까요?")) return;
  busy = true;
  try {
    const round = (game.round || 0) + 1;
    const dur = Number(document.getElementById("dur").value) || 0;
    await update(R(), {
      "game/status": "question",
      "game/round": round,
      "game/rkey": `${game.gameId}-${round}`,
      "game/qid": qid,
      "game/text": q.text,
      "game/duration": dur,
      "game/deadline": dur ? serverNow() + dur * 1000 : 0,
      "game/answer": null,
      "game/stats": null,
      "game/revived": null,
      "game/locked": true,
      [`banks/${bankKey}/q/${qid}/usedIn`]: game.gameId,
      [`banks/${bankKey}/q/${qid}/usedRound`]: round,
    });
  } finally { busy = false; }
}

async function act(a) {
  if (busy) return;
  busy = true;
  try {
    const g = game;
    if (a === "close" && g.status === "question") {
      await update(R("game"), { status: "closed" });
    }
    else if (a === "reveal" && (g.status === "question" || g.status === "closed")) {
      const correct = bank[g.qid]?.answer;
      if (correct !== "O" && correct !== "X") { alert("문제은행에서 이 문제의 정답을 찾을 수 없어요."); return; }
      // 먼저 마감해 더 이상 답을 받지 않고, 마감 직전에 들어온 답까지 다시 읽어서 채점
      if (g.status === "question") await update(R("game"), { status: "closed" });
      const ans = (await get(R(`answers/${g.rkey}`))).val() || {};
      const updates = {}; let o = 0, x = 0, none = 0, out = 0;
      for (const p of alivePlayers()) {
        const v = ans[p.id];
        if (v === "O") o++; else if (v === "X") x++; else none++;
        if (v !== correct) { updates[`players/${p.id}/alive`] = false; updates[`players/${p.id}/outRound`] = g.round; out++; }
      }
      Object.assign(updates, {
        "game/status": "reveal", "game/answer": correct, "game/stats": { o, x, none, out }, "game/deadline": 0,
      });
      await update(R(), updates);
    }
    else if (a === "revive") {
      const updates = { "game/revived": true };
      plist().filter((p) => !p.alive && p.outRound === g.round).forEach((p) => {
        updates[`players/${p.id}/alive`] = true; updates[`players/${p.id}/outRound`] = null;
      });
      await update(R(), updates);
    }
    else if (a === "lock") {
      await update(R("game"), { locked: !g.locked });
    }
    else if (a === "end") {
      if (confirm(`게임을 끝내고 생존자 ${alivePlayers().length}명을 우승자로 발표할까요?`)) await update(R("game"), { status: "ended" });
    }
    else if (a === "new") {
      if (!confirm("새 게임을 시작할까요? 참가자는 그대로 두고 모두 생존 상태로 돌아가며, 입장이 다시 열려요.")) return;
      const updates = { game: freshGame() };
      plist().forEach((p) => { updates[`players/${p.id}/alive`] = true; updates[`players/${p.id}/outRound`] = null; });
      await update(R(), updates);
    }
    else if (a === "clear") {
      if (!confirm("참가자를 모두 삭제할까요? 참가자들은 이름을 다시 입력해야 해요.")) return;
      const updates = { game: freshGame() };
      plist().forEach((p) => { updates[`players/${p.id}`] = null; });
      await update(R(), updates);
    }
  } catch (e) {
    alert("저장에 실패했어요: " + (e.message || e));
  } finally { busy = false; }
}
</script>
</body>
</html>
