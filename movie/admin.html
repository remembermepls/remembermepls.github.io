<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>이모지 영화 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#1d1d1f; --panel:#252528; --line:#34343a;
  --fg:#f4f4f5; --muted:#8d8d96; --pink:#fd2155; --mint:#08fdd8; --gold:#ffc94d;
  --display:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;padding-bottom:180px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px max(16px,4vw);border-bottom:1px solid var(--line)}
header h1{margin:0;font:900 20px var(--display);letter-spacing:-.5px}
header h1 span{color:var(--pink)}
header h1 em{font:700 12px var(--body);color:var(--muted);font-style:normal;margin-left:8px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;vertical-align:middle}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live i{background:var(--mint);box-shadow:0 0 0 4px rgba(8,253,216,.15)}
.status.offline i{background:var(--pink)}

.wrap{max-width:1080px;margin:0 auto;padding:20px max(16px,3vw)}
.share{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:20px}
.share code{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--fg);word-break:break-all}
.small{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.small:hover{border-color:var(--mint);color:var(--mint)}
.tools{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.item{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 10px 12px;text-align:center;cursor:pointer;transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--muted)}
.item .no{position:absolute;top:8px;left:10px;font:800 11px var(--display);color:var(--muted)}
.item .e{display:block;font-size:26px;line-height:1.3;margin:4px 0 4px;white-space:nowrap}
.item .e.long{font-size:19px;line-height:1.75}
.item .k{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.item .t{display:block;font-size:13px;font-weight:700}
.item.sel{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.item.used{opacity:.45}
.item.used .no::after{content:" ✓ 출제함"}
.item.live{opacity:1;border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset}
.item.live .no{color:var(--mint)}
.item.live .no::after{content:" ● 출제 중"}
.item .lv{position:absolute;top:7px;right:8px;font-size:10px;font-weight:700;border-radius:999px;padding:0 7px;border:1px solid currentColor}
.lv1{color:var(--mint)} .lv2{color:var(--gold)} .lv3{color:var(--pink)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab small{font-weight:400;margin-left:4px;opacity:.8}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tab.lv1[aria-selected="true"]{background:var(--mint);border-color:var(--mint)}
.tab.lv2[aria-selected="true"]{background:var(--gold);border-color:var(--gold)}
.tab.lv3[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.tab.kr{margin-left:6px}
.tab.kr[aria-selected="true"]{background:#4f7cff;border-color:#4f7cff;color:#fff}
.tools .right{display:flex;gap:8px;flex-wrap:wrap}

.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,20,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px max(16px,3vw) calc(14px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.preview{flex:1;min-width:200px;display:flex;align-items:center;gap:12px}
.preview .e{font-size:36px;line-height:1}
.preview .t{font-weight:700}
.preview small{display:block;color:var(--muted);font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;background:var(--panel);border:1px solid var(--line)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.mint{border-color:var(--mint);color:var(--mint)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.toast{min-height:20px;font-size:13px;color:var(--muted);flex-basis:100%;text-align:right}
.toast.err{color:var(--pink)}
</style>
</head>
<body>
<header>
  <h1>Emoji<span>Movie</span><em>관리자</em></h1>
  <div class="status" id="status"><i></i><span>연결 중…</span></div>
</header>

<div class="wrap">
  <div class="share">
    참가자 페이지 <code id="link"></code>
    <button class="small" id="copyBtn">링크 복사</button>
    <a class="small" id="openLink" target="_blank" rel="noopener" style="text-decoration:none">새 창으로 열기</a>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="난이도"></div>
  <div class="tools">
    <span>난이도를 고르고 문제를 고른 뒤 아래 <b style="color:var(--pink)">문제내기</b>를 누르세요. <span id="usedCount"></span></span>
    <span class="right">
      <button class="small" id="randomBtn">🎲 이 난이도에서 랜덤 고르기</button>
      <button class="small" id="resetUsed">출제 기록 지우기</button>
    </span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="preview" id="preview"></div>
    <div class="btns">
      <button class="btn primary" id="sendBtn" disabled>문제내기</button>
      <button class="btn mint" id="revealBtn" disabled>정답 공개</button>
      <button class="btn" id="clearBtn">화면 비우기</button>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
  </div>
</div>

<script src="movies.js"></script>
<script>
const $ = id => document.getElementById(id);
const USED_KEY = "emoji-movie-used-v2";   // 문제 목록을 새로 짜면서 번호가 바뀌어 기록도 새로 시작
const LEVEL_KEY = "emoji-movie-level";
let selected = null;
let level = 0;   // 0 = 전체, 1 쉬움, 2 보통, 3 어려움, "k" = 천만 한국 영화
try { const v = localStorage.getItem(LEVEL_KEY); level = v === "k" ? "k" : (LEVELS[Number(v)] ? Number(v) : 0); } catch (e) {}
let live = { id: null, revealed: false };
let used = new Set();
try { used = new Set(JSON.parse(localStorage.getItem(USED_KEY) || "[]")); } catch (e) {}
const saveUsed = () => { try { localStorage.setItem(USED_KEY, JSON.stringify([...used])); } catch (e) {} };

const viewerUrl = new URL("./", location.href).href;
$("link").textContent = viewerUrl;
$("openLink").href = viewerUrl;
$("copyBtn").onclick = () => navigator.clipboard.writeText(viewerUrl).then(() => toast("링크를 복사했어요."), () => toast("복사하지 못했어요. 직접 선택해 복사해 주세요.", true));

// 문제 카드 그리기
MOVIES.forEach(m => {
  const b = document.createElement("button");
  b.className = "item";
  b.dataset.id = m.id;
  b.innerHTML = `<span class="no"></span><span class="lv lv${m.level}"></span><span class="e"></span><span class="t"></span>`;
  b.querySelector(".no").textContent = `#${m.id}`;
  b.querySelector(".lv").textContent = LEVELS[m.level];
  b.querySelector(".e").textContent = m.emoji;
  if (emojiCount(m.emoji) > 4) b.querySelector(".e").classList.add("long");
  b.querySelector(".t").textContent = m.title;
  if (m.k10m) b.insertAdjacentHTML("beforeend", `<span class="k">🇰🇷 천만 영화</span>`);
  b.onclick = () => { selected = m.id; render(); };
  b.ondblclick = () => { selected = m.id; send(); };
  $("grid").appendChild(b);
});

// 난이도 탭
const TABS = [0, 1, 2, 3, "k"];
const tabName = l => l === "k" ? "🇰🇷 천만 영화" : l ? LEVELS[l] : "전체";
const tabMatch = (l, m) => l === "k" ? !!m.k10m : (!l || m.level === l);
TABS.forEach(l => {
  const t = document.createElement("button");
  t.className = "tab" + (l === "k" ? " kr" : l ? ` lv${l}` : "");
  t.setAttribute("role", "tab");
  t.dataset.level = l;
  t.onclick = () => {
    level = l;
    try { localStorage.setItem(LEVEL_KEY, String(l)); } catch (e) {}
    render();
  };
  $("tabs").appendChild(t);
});

const inLevel = m => tabMatch(level, m);

// 현재 난이도에서 아직 안 낸 문제 중 하나를 무작위로 고른다 (다 냈으면 전체에서).
$("randomBtn").onclick = () => {
  const pool = MOVIES.filter(inLevel).filter(m => m.id !== live.id);
  const fresh = pool.filter(m => !used.has(m.id));
  const from = fresh.length ? fresh : pool;
  if (!from.length) return;
  selected = from[Math.floor(Math.random() * from.length)].id;
  render();
  document.querySelector(`.item[data-id="${selected}"]`).scrollIntoView({ block: "center", behavior: "smooth" });
  if (!fresh.length) toast(`${level ? tabName(level) : "모든"} 문제를 다 냈어요. 이미 낸 문제 중에서 골랐어요.`);
};

function render() {
  [...$("tabs").children].forEach(t => {
    const l = t.dataset.level === "k" ? "k" : Number(t.dataset.level);
    const list = MOVIES.filter(m => tabMatch(l, m));
    const done = list.filter(m => used.has(m.id)).length;
    t.setAttribute("aria-selected", String(l === level));
    t.innerHTML = "";
    t.append(tabName(l));
    const c = document.createElement("small");
    c.textContent = done ? `${done}/${list.length}` : String(list.length);
    t.appendChild(c);
  });
  $("randomBtn").textContent = `🎲 ${tabName(level)}에서 랜덤 고르기`;

  [...$("grid").children].forEach(b => {
    const id = Number(b.dataset.id);
    b.hidden = !inLevel(findMovie(id));
    b.classList.toggle("sel", id === selected);
    b.classList.toggle("used", used.has(id) && id !== live.id);
    b.classList.toggle("live", id === live.id);
  });
  $("usedCount").textContent = used.size ? `(${used.size}/${MOVIES.length} 출제함)` : "";

  const cur = findMovie(live.id), sel = findMovie(selected);
  const p = $("preview");
  if (sel) {
    p.innerHTML = `<span class="e"></span><div><small>선택한 문제</small><span class="t"></span></div>`;
    p.querySelector(".e").textContent = sel.emoji;
    if (emojiCount(sel.emoji) > 4) p.querySelector(".e").style.fontSize = "26px";
    p.querySelector(".t").textContent = `#${sel.id} ${sel.title} · ${LEVELS[sel.level]}`;
  } else {
    p.innerHTML = `<div><small>선택한 문제</small><span class="t" style="color:var(--muted)">위에서 문제를 골라 주세요</span></div>`;
  }
  if (cur) {
    const s = document.createElement("small");
    s.style.marginTop = "2px";
    s.textContent = `지금 화면: #${cur.id} ${cur.title}${live.revealed ? " (정답 공개됨)" : ""}`;
    p.lastElementChild.appendChild(s);
  }
  $("sendBtn").disabled = !sel;
  $("revealBtn").disabled = !cur || live.revealed;
}

let tt;
function toast(text, err) {
  $("toast").textContent = text;
  $("toast").className = "toast" + (err ? " err" : "");
  clearTimeout(tt);
  // 오류는 다음 동작 전까지 남겨 둔다.
  if (!err) tt = setTimeout(() => { $("toast").textContent = ""; }, 3500);
}

function post(msg, okText) {
  const btns = ["sendBtn", "revealBtn", "clearBtn"].map($);
  btns.forEach(b => b.disabled = true);
  return publish(msg)
    .then(() => { toast(okText); return true; })
    .catch(e => {
      toast(e.status === 429
        ? "전송 한도를 넘었어요 (ntfy.sh 무료: 인터넷 주소(IP)당 12시간에 250개). 잠시 후 다시 시도하거나 다른 네트워크(예: 휴대폰 데이터)에서 보내 주세요."
        : `전송하지 못했어요 (${e.message}). 인터넷 연결을 확인해 주세요.`, true);
      return false;
    })
    .finally(() => { $("clearBtn").disabled = false; render(); });
}

function send() {
  const m = findMovie(selected);
  if (!m) return;
  post({ t: "q", id: m.id }, `#${m.id} 문제를 냈어요.`).then(sent => {
    if (sent) { used.add(m.id); saveUsed(); render(); }
  });
}
$("sendBtn").onclick = send;
$("revealBtn").onclick = () => {
  if (live.id) post({ t: "a", id: live.id }, "정답을 공개했어요.");
};
$("clearBtn").onclick = () => post({ t: "c" }, "참가자 화면을 비웠어요.");
$("resetUsed").onclick = () => {
  if (!used.size || confirm("출제 기록(✓ 표시)을 모두 지울까요?")) { used.clear(); saveUsed(); render(); }
};

// 참가자 화면과 같은 채널을 구독해서 '지금 화면에 뭐가 떠 있는지' 표시
subscribe(msg => {
  live = reduceState(live, msg);
  render();
}, s => {
  $("status").className = "status " + s;
  $("status").querySelector("span").textContent =
    s === "live" ? "실시간 연결됨" : s === "connecting" ? "연결 중…" : "재연결 중…";
});
render();
</script>
</body>
</html>
