<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>가위바위보 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="../ox/style.css">
<link rel="stylesheet" href="style.css">
<style>
main{flex:1;padding:24px max(16px,4vw) 48px;width:100%;max-width:1200px;margin:0 auto}
.login{max-width:420px;margin:10vh auto 0;display:grid;gap:12px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:20px}
.panel h3{margin:0 0 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 small{color:var(--muted);font-weight:400;font-size:13px}
.panel .field{background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;color:var(--muted)}
.pill.on{border-color:var(--mint);color:var(--mint)}
.pill.warn{border-color:var(--pink);color:var(--pink)}
.cur{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;display:flex;gap:16px;align-items:center}
.cur .e{font-size:56px;line-height:1;flex:none}
.cur .t{font-weight:700;font-size:18px}
.cur .m{color:var(--muted);font-size:13px;margin-top:4px}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.nums div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.nums b{display:block;font:900 26px var(--display);line-height:1.2}
.nums span{color:var(--muted);font-size:12px}
.nums .win{border-color:var(--mint)} .nums .lose{border-color:var(--pink)}
.ok-c{color:var(--mint)} .no-c{color:var(--pink)}
.ctrl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ctrl .btn{padding:10px 12px;font-size:14px}
.pickhand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.pickhand label{cursor:pointer}
.pickhand input{position:absolute;opacity:0;pointer-events:none}
.pickhand span{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);border-radius:14px;padding:10px 4px;background:var(--bg);font-size:13px;color:var(--muted)}
.pickhand span b{font-size:34px;line-height:1.1}
.pickhand input:checked + span{border-color:var(--mint);color:var(--mint);background:rgba(8,253,216,.1)}
.pickhand input:focus-visible + span{outline:2px solid var(--mint);outline-offset:2px}
.pickhand input:disabled + span{opacity:.4;cursor:default}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px}
.person.out{opacity:.4;text-decoration:line-through}
.person .a{font-size:15px}
.person .icon{padding:0 4px}
.icon{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;flex:none}
.icon:hover{color:var(--pink)}
.empty{color:var(--muted);font-size:14px;margin:0}
.link{font-size:13px;color:var(--muted);word-break:break-all}
.link a{color:var(--mint)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.hist li{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.hist .r{color:var(--muted);width:32px;flex:none}
.hist .e{font-size:22px;flex:none}
.hist .s{color:var(--muted);flex:1;min-width:0}
</style>
</head>
<body>
<header>
  <h1>가위바위보<span>관리자</span></h1>
  <span class="me" id="who"></span>
</header>
<main id="main"></main>

<script type="module">
import { configured, R, serverNow, esc, store, SETUP_HTML, HANDS, ORDER, outcome } from "./common.js";
import { onValue, get, set, update, remove, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $main = document.getElementById("main");
const KEY = "rps_admin_key";
let secretKey = store.get(KEY);
let game = null, players = {}, picks = {}, picksPath = null;
let myHand = null, handPath = null;     // 이번 라운드 관리자의 손 (참가자는 볼 수 없는 위치에 저장)
let busy = false;

if (!configured) $main.innerHTML = `<div style="max-width:520px;margin:10vh auto 0">${SETUP_HTML}</div>`;
else if (!secretKey) showLogin();
else start();

function showLogin() {
  $main.innerHTML = `
    <form class="login" id="login">
      <div class="intro"><p class="big">🔐</p><h2>관리자 입장</h2>
      <p>관리자 비밀번호를 입력하세요.<br>처음이면 새로 정할 비밀번호를 입력하면 돼요.<br>
      관리자가 낸 손은 이 비밀번호로만 열 수 있는 곳에 숨겨 둬요.</p></div>
      <input class="field" id="pw" type="password" minlength="6" placeholder="비밀번호 (6자 이상)" required autocomplete="current-password">
      <button class="btn">들어가기</button>
    </form>`;
  document.getElementById("pw").focus();
  document.getElementById("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    if (pw.length < 6) return;
    // 비밀번호 자체는 저장하지 않고, 해시값을 숨김 저장소 주소로 쓴다
    const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("rps-game:" + pw));
    secretKey = "k_" + Array.from(new Uint8Array(hash), (b) => b.toString(16).padStart(2, "0")).join("");
    store.set(KEY, secretKey);
    start();
  });
}

function start() {
  $main.innerHTML = `
    <div class="grid">
      <div>
        <section class="panel">
          <h3>진행 <small id="link"></small></h3>
          <div class="status" id="status"></div>
          <div id="current"></div>
          <div class="nums" id="nums"></div>
          <div class="ctrl" id="ctrl"></div>
        </section>
        <section class="panel">
          <h3>다음 라운드 준비</h3>
          <div class="pickhand" role="radiogroup" aria-label="관리자가 낼 손">
            <label><input type="radio" name="hand" value="random" checked><span><b>🎲</b>랜덤</span></label>
            ${ORDER.map((h) => `<label><input type="radio" name="hand" value="${h}"><span><b>${HANDS[h].emoji}</b>${HANDS[h].name}</span></label>`).join("")}
          </div>
          <div class="row" style="margin-bottom:12px">
            <label for="dur" style="color:var(--muted);font-size:14px">제한시간</label>
            <select class="field" id="dur" style="width:auto;padding:8px 12px">
              <option value="0">없음</option><option value="5">5초</option><option value="10" selected>10초</option>
              <option value="15">15초</option><option value="20">20초</option><option value="30">30초</option>
            </select>
          </div>
          <button class="btn" id="go" style="width:100%">라운드 시작</button>
          <p class="empty" style="margin-top:10px">관리자의 손은 시작하는 순간 정해지고, 결과를 공개할 때까지 참가자에게 보이지 않아요. 첫 라운드를 시작하면 입장이 자동으로 잠겨요.</p>
        </section>
      </div>
      <div>
        <section class="panel">
          <h3>참가자 <small id="pcount"></small></h3>
          <div id="people"></div>
        </section>
        <section class="panel">
          <h3>지난 라운드</h3>
          <ul class="hist" id="hist"></ul>
        </section>
        <p class="link"><button class="btn ghost sm" id="logout" type="button">비밀번호 바꾸기</button></p>
      </div>
    </div>`;

  const userUrl = new URL("./", location.href).href;
  document.getElementById("link").innerHTML = `참가 주소 <a href="${esc(userUrl)}" target="_blank" rel="noopener">${esc(userUrl)}</a>`;
  document.getElementById("logout").addEventListener("click", () => { store.del(KEY); location.reload(); });
  document.getElementById("go").addEventListener("click", startRound);
  $main.addEventListener("click", onClick);

  onValue(R("players"), (s) => { players = s.val() || {}; renderPeople(); renderGame(); });
  onValue(R("game"), async (s) => {
    game = s.val();
    if (!game || !game.gameId) { await set(R("game"), freshGame()); return; }
    watchRound(); renderGame(); renderPeople(); renderHist();
  });
  setInterval(tick, 250);
}

const freshGame = () => ({ gameId: Date.now().toString(36), status: "lobby", locked: false, round: 0, deadline: 0, duration: 0 });

function watchRound() {
  const p = game?.rkey ? `picks/${game.rkey}` : null;
  if (p !== picksPath) {
    if (picksPath) off(R(picksPath));
    picksPath = p; picks = {};
    if (p) onValue(R(p), (s) => { picks = s.val() || {}; renderGame(); renderPeople(); });
  }
  const h = game?.rkey ? `secret/${secretKey}/${game.rkey}` : null;
  if (h !== handPath) {
    if (handPath) off(R(handPath));
    handPath = h; myHand = null;
    if (h) onValue(R(h), (s) => { myHand = s.val(); renderGame(); });
  }
}

const plist = () => Object.entries(players).map(([id, p]) => ({ id, ...p }));
const alivePlayers = () => plist().filter((p) => p.alive);
const STATUS = { lobby: "대기 중", pick: "라운드 진행 중", closed: "마감 · 공개 전", reveal: "결과 공개됨", ended: "게임 종료" };

function renderGame() {
  if (!game) return;
  const g = game, s = g.status;
  const alive = alivePlayers();
  document.getElementById("who").textContent = `R${g.round || 0} · ${STATUS[s] || ""}`;
  document.getElementById("status").innerHTML = `
    <span class="pill on">${STATUS[s] || s}</span>
    <span class="pill">ROUND ${g.round || 0}</span>
    <span class="pill ${g.locked ? "warn" : "on"}">${g.locked ? "입장 잠김" : "입장 가능"}</span>`;

  const inRound = s === "pick" || s === "closed";
  const hand = inRound ? myHand : s === "reveal" ? g.hand : null;
  document.getElementById("current").innerHTML = inRound || s === "reveal"
    ? `<div class="cur">
        <div class="e">${HANDS[hand]?.emoji ?? "❔"}</div>
        <div><div class="t">관리자: ${HANDS[hand]?.name ?? (inRound ? "손을 찾을 수 없어요" : "")}</div>
        <div class="m">${inRound ? "참가자에게는 아직 비밀이에요" : "공개됨"}<span id="left"></span></div></div>
      </div>`
    : `<div class="cur"><div class="m">아래 <b>다음 라운드 준비</b>에서 낼 손과 제한시간을 고르고 <b>라운드 시작</b>을 누르세요.</div></div>`;

  // 진행 중에는 실시간 집계, 공개 후에는 채점 결과
  let cnt;
  if (inRound) {
    cnt = { S: 0, R: 0, P: 0, none: 0, win: 0, draw: 0, lose: 0 };
    for (const p of alive) {
      const v = picks[p.id];
      if (HANDS[v]) cnt[v]++; else cnt.none++;
      const res = HANDS[myHand] ? outcome(v, myHand) : null;
      if (res === "win" || res === "draw" || res === "lose") cnt[res]++;
    }
  } else cnt = g.stats || {};
  const n = (k) => (inRound || s === "reveal") ? (cnt[k] ?? 0) : "–";
  document.getElementById("nums").innerHTML = `
    ${ORDER.map((h) => `<div><b>${n(h)}</b><span>${HANDS[h].emoji} ${HANDS[h].name}</span></div>`).join("")}
    <div><b>${n("none")}</b><span>안 냄</span></div>
    <div class="win"><b class="ok-c">${n("win")}</b><span>이김</span></div>
    <div class="win"><b class="ok-c">${n("draw")}</b><span>비김</span></div>
    <div class="lose"><b class="no-c">${inRound ? (HANDS[myHand] ? cnt.lose + cnt.none : "–") : s === "reveal" ? (cnt.out ?? 0) : "–"}</b><span>${inRound ? "탈락 예정" : "탈락"}</span></div>
    <div><b>${alive.length}</b><span>생존</span></div>`;

  const outThisRound = plist().filter((p) => !p.alive && p.outRound === g.round).length;
  document.getElementById("ctrl").innerHTML = `
    <button class="btn" data-act="close" ${s === "pick" ? "" : "disabled"}>지금 마감</button>
    <button class="btn mint" data-act="reveal" ${inRound ? "" : "disabled"}>손 공개 · 채점</button>
    <button class="btn ghost" data-act="revive" ${s === "reveal" && outThisRound ? "" : "disabled"}>이번 탈락자 부활 (${outThisRound})</button>
    <button class="btn ghost" data-act="lock" ${s === "ended" ? "disabled" : ""}>${g.locked ? "입장 다시 허용" : "입장 잠그기"}</button>
    <button class="btn ghost" data-act="end" ${s === "lobby" || s === "reveal" ? "" : "disabled"}>게임 종료 · 우승 발표</button>
    <button class="btn ghost" data-act="new">새 게임 (모두 부활)</button>
    <button class="btn ghost" data-act="clear">참가자 전체 삭제</button>`;

  const canStart = s === "lobby" || s === "reveal";
  document.getElementById("go").disabled = !canStart;
  document.querySelectorAll('input[name="hand"]').forEach((i) => (i.disabled = !canStart));
  tick();
}

function renderPeople() {
  const el = document.getElementById("people");
  if (!el || !game) return;
  const list = plist().sort((a, b) => (b.alive - a.alive) || a.name.localeCompare(b.name, "ko"));
  document.getElementById("pcount").textContent = `생존 ${list.filter((p) => p.alive).length} / 전체 ${list.length}`;
  const showPick = game.status === "pick" || game.status === "closed";
  el.innerHTML = list.length ? `<div class="people">${list.map((p) => {
    const v = showPick && p.alive ? picks[p.id] : null;
    return `<span class="person ${p.alive ? "" : "out"}">${esc(p.name)}
      ${v && HANDS[v] ? `<span class="a" title="${HANDS[v].name}">${HANDS[v].emoji}</span>` : showPick && p.alive ? `<span class="a" style="color:var(--muted)">…</span>` : ""}
      <button class="icon" data-kick="${esc(p.id)}" aria-label="${esc(p.name)} 내보내기" title="내보내기">✕</button></span>`;
  }).join("")}</div>` : `<p class="empty">아직 입장한 사람이 없어요. 참가 주소를 공유하세요.</p>`;
}

function renderHist() {
  const el = document.getElementById("hist");
  if (!el || !game) return;
  const h = Object.values(game.history || {}).sort((a, b) => b.round - a.round);
  el.innerHTML = h.length ? h.map((r) => `
    <li><span class="r">R${r.round}</span><span class="e">${HANDS[r.hand]?.emoji ?? ""}</span>
    <span class="s">${ORDER.map((k) => `${HANDS[k].emoji}${r[k] ?? 0}`).join(" · ")} · 안 냄 ${r.none ?? 0}</span>
    <b class="no-c">−${r.out ?? 0}</b></li>`).join("") : `<p class="empty">아직 진행한 라운드가 없어요.</p>`;
}

function tick() {
  const el = document.getElementById("left");
  if (!game || game.status !== "pick") { if (el) el.textContent = ""; return; }
  if (!game.deadline) { if (el) el.textContent = " · 제한시간 없음"; return; }
  const left = game.deadline - serverNow();
  if (el) el.textContent = left > 0 ? ` · 남은 시간 ${Math.ceil(left / 1000)}초` : " · 시간 종료";
  // 제한시간이 끝나고 늦게 도착한 선택까지 받은 뒤 자동 마감
  if (left < -1500 && !busy) act("close");
}

async function onClick(e) {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.kick) {
    const p = players[b.dataset.kick];
    if (p && confirm(`${p.name}님을 내보낼까요? 같은 이름으로 다시 들어오려면 입장이 허용되어 있어야 해요.`)) await remove(R(`players/${b.dataset.kick}`));
    return;
  }
  if (b.dataset.act) act(b.dataset.act);
}

async function startRound() {
  if (busy || !game || !(game.status === "lobby" || game.status === "reveal")) return;
  if (!alivePlayers().length && !confirm("생존자가 없어요. 그래도 시작할까요?")) return;
  busy = true;
  try {
    let hand = document.querySelector('input[name="hand"]:checked')?.value;
    if (!HANDS[hand]) hand = ORDER[crypto.getRandomValues(new Uint32Array(1))[0] % 3];
    const round = (game.round || 0) + 1;
    const rkey = `${game.gameId}-${round}`;
    const dur = Number(document.getElementById("dur").value) || 0;
    // 손을 먼저 숨김 저장소에 적고 나서 라운드를 연다 (공개 전까지 game에는 손이 없다)
    await set(R(`secret/${secretKey}/${rkey}`), hand);
    await update(R("game"), {
      status: "pick", round, rkey, duration: dur,
      deadline: dur ? serverNow() + dur * 1000 : 0,
      hand: null, stats: null, revived: null, locked: true,
    });
  } catch (e) {
    alert("라운드를 시작하지 못했어요: " + (e.message || e));
  } finally { busy = false; }
}

async function act(a) {
  if (busy) return;
  busy = true;
  try {
    const g = game;
    if (a === "close" && g.status === "pick") {
      await update(R("game"), { status: "closed" });
    }
    else if (a === "reveal" && (g.status === "pick" || g.status === "closed")) {
      const hand = (await get(R(`secret/${secretKey}/${g.rkey}`))).val();
      if (!HANDS[hand]) { alert("이번 라운드에 관리자가 낸 손을 찾을 수 없어요. 라운드를 시작한 기기와 같은 비밀번호로 들어왔는지 확인해 주세요."); return; }
      // 먼저 마감해 더 이상 선택을 받지 않고, 마감 직전에 들어온 것까지 다시 읽어서 채점
      if (g.status === "pick") await update(R("game"), { status: "closed" });
      const all = (await get(R(`picks/${g.rkey}`))).val() || {};
      const st = { S: 0, R: 0, P: 0, none: 0, win: 0, draw: 0, lose: 0, out: 0 };
      const updates = {};
      for (const p of alivePlayers()) {
        const v = all[p.id];
        if (HANDS[v]) st[v]++; else st.none++;
        const res = outcome(v, hand);
        if (res === "win" || res === "draw") st[res]++;
        else {
          if (res === "lose") st.lose++;
          updates[`players/${p.id}/alive`] = false; updates[`players/${p.id}/outRound`] = g.round; st.out++;
        }
      }
      Object.assign(updates, {
        "game/status": "reveal", "game/hand": hand, "game/stats": st, "game/deadline": 0,
        [`game/history/r${g.round}`]: { round: g.round, hand, S: st.S, R: st.R, P: st.P, none: st.none, out: st.out },
      });
      await update(R(), updates);
    }
    else if (a === "revive") {
      const updates = { "game/revived": true };
      plist().filter((p) => !p.alive && p.outRound === g.round).forEach((p) => {
        updates[`players/${p.id}/alive`] = true; updates[`players/${p.id}/outRound`] = null;
      });
      await update(R(), updates);
    }
    else if (a === "lock") {
      await update(R("game"), { locked: !g.locked });
    }
    else if (a === "end") {
      if (confirm(`게임을 끝내고 생존자 ${alivePlayers().length}명을 우승자로 발표할까요?`)) await update(R("game"), { status: "ended" });
    }
    else if (a === "new") {
      if (!confirm("새 게임을 시작할까요? 참가자는 그대로 두고 모두 생존 상태로 돌아가며, 입장이 다시 열려요.")) return;
      const updates = { game: freshGame() };
      plist().forEach((p) => { updates[`players/${p.id}/alive`] = true; updates[`players/${p.id}/outRound`] = null; });
      await update(R(), updates);
    }
    else if (a === "clear") {
      if (!confirm("참가자를 모두 삭제할까요? 참가자들은 이름을 다시 입력해야 해요.")) return;
      const updates = { game: freshGame() };
      plist().forEach((p) => { updates[`players/${p.id}`] = null; });
      await update(R(), updates);
    }
  } catch (e) {
    alert("저장에 실패했어요: " + (e.message || e));
  } finally { busy = false; }
}
</script>
</body>
</html>
