<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="관리자를 이기거나 비기면 살아남는 가위바위보 서바이벌">
<title>가위바위보 서바이벌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="../ox/style.css">
<link rel="stylesheet" href="style.css">
<style>
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 48px}
.card{width:100%;max-width:520px}
.join{display:grid;gap:12px;text-align:left}
.join .btn{width:100%;padding:14px}
</style>
</head>
<body>
<header>
  <h1>가위바위보<span>서바이벌</span></h1>
  <span class="me" id="me"></span>
</header>
<main><div class="card" id="main" aria-live="polite"></div></main>

<script type="module">
import { configured, R, serverNow, cleanName, nameKey, randomId, esc, store, SETUP_HTML, HANDS, ORDER, outcome } from "./common.js";
import { onValue, get, set, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $main = document.getElementById("main");
const $me = document.getElementById("me");
const ME_KEY = "rps_me";

let me = store.get(ME_KEY);        // { key, name, token }
let game = null, gameLoaded = false;
let player = null, playerLoaded = false;
let players = {};
let myPick = null, pickRef = null;
let notice = "";
let lastSig = null;

if (!configured) {
  $main.innerHTML = SETUP_HTML;
} else {
  onValue(R("game"), (s) => { game = s.val() || {}; gameLoaded = true; watchPick(); render(); });
  onValue(R("players"), (s) => { players = s.val() || {}; render(); });
  if (me) watchPlayer();
  setInterval(tick, 200);
}

function watchPlayer() {
  onValue(R("players/" + me.key), (s) => {
    const p = s.val();
    playerLoaded = true;
    if (!p || p.token !== me.token) {
      // 관리자가 내보냈거나 명단이 초기화됨 → 다시 이름 입력
      off(R("players/" + me.key));
      if (me) notice = "참가자 명단에서 빠졌어요. 다시 입장해 주세요.";
      store.del(ME_KEY); me = null; player = null;
    } else {
      player = p;
    }
    render();
  });
}

function watchPick() {
  const rk = game?.rkey && me ? `picks/${game.rkey}/${me.key}` : null;
  if (pickRef === rk) return;
  if (pickRef) off(R(pickRef));
  pickRef = rk; myPick = null;
  if (rk) onValue(R(rk), (s) => { myPick = s.val(); render(); });
}

async function join(name) {
  const $err = document.getElementById("err");
  const $btn = document.getElementById("joinBtn");
  name = cleanName(name);
  if (!name) { $err.textContent = "이름을 입력해 주세요."; return; }
  if (name.length > 20) { $err.textContent = "이름은 20자 이하로 입력해 주세요."; return; }
  const key = nameKey(name);
  const token = randomId();
  $btn.disabled = true; $err.textContent = "";
  try {
    if ((await get(R("players/" + key))).val()) {
      $err.textContent = "이미 사용 중인 이름이에요. 다른 이름을 입력해 주세요.";
      $btn.disabled = false; return;
    }
    if (game?.locked) {
      $err.textContent = "이미 게임이 시작되어 입장할 수 없어요.";
      $btn.disabled = false; return;
    }
    await set(R("players/" + key), { name, alive: true, token, joinedAt: serverNow() });
    me = { key, name, token };
    store.set(ME_KEY, me);
    notice = "";
    watchPlayer(); watchPick();
  } catch (e) {
    $err.textContent = game?.locked ? "이미 게임이 시작되어 입장할 수 없어요." : "입장에 실패했어요. 잠시 후 다시 시도해 주세요.";
    $btn.disabled = false;
  }
}

async function choose(h) {
  if (!me || !game?.rkey || !player?.alive || game.status !== "pick") return;
  if (game.deadline && serverNow() > game.deadline) return;
  try {
    await set(R(`picks/${game.rkey}/${me.key}`), h);
  } catch (e) {
    const el = document.getElementById("hint");
    if (el) el.textContent = "낼 수 없어요. 이미 마감되었을 수 있어요.";
  }
}

$main.addEventListener("click", (e) => {
  const b = e.target.closest("[data-h]");
  if (b && !b.disabled) choose(b.dataset.h);
});
$main.addEventListener("submit", (e) => {
  e.preventDefault();
  join(document.getElementById("name").value);
});

const playerList = () => Object.values(players);
const aliveCount = () => playerList().filter((p) => p.alive).length;
const handLabel = (h) => HANDS[h] ? `${HANDS[h].emoji} ${HANDS[h].name}` : "";

function view() {
  if (!gameLoaded || (me && !playerLoaded)) {
    return { sig: "loading", html: `<div class="intro"><p class="big">⏳</p><p>연결하는 중…</p></div>` };
  }
  const g = game || {};
  if (!me || !player) {
    const locked = !!g.locked;
    return {
      sig: "join" + locked + notice,
      html: `
        <div class="intro">
          <p class="big">✌️✊✋</p>
          <h2>가위바위보 서바이벌</h2>
          <p>관리자와 가위바위보!<br>이기거나 비기면 생존, 지면 탈락이에요.</p>
        </div>
        ${locked
          ? `<p class="err" style="text-align:center">이미 게임이 시작되어 새로 입장할 수 없어요.</p>`
          : `<form class="join">
              <input class="field" id="name" maxlength="20" autocomplete="nickname" placeholder="이름을 입력하세요" required>
              <button class="btn" id="joinBtn">입장하기</button>
              <p class="err" id="err">${esc(notice)}</p>
            </form>`}`,
      after: () => document.getElementById("name")?.focus(),
    };
  }

  const alive = !!player.alive;
  const round = g.round || 0;
  const roundLabel = `ROUND ${round}`;

  switch (g.status) {
    case "pick": {
      if (!alive) {
        return {
          sig: `spec|${g.rkey}`,
          html: `
            <div class="meta"><span class="cat">${roundLabel}</span><span id="timer"></span></div>
            <div class="bar"><i id="bar"></i></div>
            <div class="intro"><p class="big"><span class="shake">✊</span></p>
            <p class="result no">탈락 · 관전 중</p><p>생존자 ${aliveCount()}명이 관리자와 겨루고 있어요.</p></div>`,
        };
      }
      return {
        sig: `pick|${g.rkey}|${myPick}`,
        html: `
          <div class="meta"><span class="cat">${roundLabel}</span><span id="timer"></span></div>
          <div class="bar"><i id="bar"></i></div>
          <div class="intro" style="margin-bottom:16px"><h2>무엇을 낼까요?</h2><p style="margin:0">관리자는 이미 냈어요. 이기거나 비기면 생존!</p></div>
          <div class="hands">
            ${ORDER.map((h) => `
              <button class="${myPick === h ? "sel" : ""}" data-h="${h}" aria-label="${HANDS[h].name}" aria-pressed="${myPick === h}">
                <span class="e">${HANDS[h].emoji}</span><span class="l">${HANDS[h].name}</span>
              </button>`).join("")}
          </div>
          <p class="hint" id="hint">${myPick ? `<b>${handLabel(myPick)}</b> 선택 · 마감 전까지 바꿀 수 있어요` : "아직 아무것도 내지 않았어요. 안 내면 탈락이에요"}</p>`,
      };
    }
    case "closed":
      return {
        sig: `closed|${g.rkey}|${myPick}|${alive}`,
        html: `
          <div class="meta"><span class="cat">${roundLabel}</span><span>마감</span></div>
          <div class="intro">
            <p class="big"><span class="shake">✊</span></p>
            <h2>가위, 바위…</h2>
            <p>관리자의 손을 공개하기를 기다리는 중<br>${alive ? (myPick ? `내 선택: <b>${handLabel(myPick)}</b>` : "아무것도 내지 않았어요") : "관전 중"}</p>
          </div>`,
      };
    case "reveal": {
      const st = g.stats || {};
      const outNow = player.outRound === round;
      const playedNow = alive || outNow;   // 이번 라운드에 참가했는지
      const res = outcome(myPick, g.hand);
      const resHtml = !playedNow
        ? `<p class="result no">탈락 · 관전 중</p>`
        : alive
          ? (res === "win" ? `<p class="result ok">이겼어요! 생존 🎉</p>`
              : res === "draw" ? `<p class="result ok">비겼어요! 생존 😮‍💨</p>`
              : `<p class="result ok">패자부활! 다시 도전하세요</p>`)   // 졌는데 살아 있으면 관리자가 부활시킨 것
          : res === "none" ? `<p class="result no">아무것도 안 내서 탈락</p>`
          : `<p class="result no">졌어요… 탈락</p>`;
      const mine = playedNow ? `
          <div class="mine ${res}"><div class="who">나</div><div class="e">${myPick && HANDS[myPick] ? HANDS[myPick].emoji : "❔"}</div><div class="nm">${myPick && HANDS[myPick] ? HANDS[myPick].name : "안 냄"}</div></div>` : "";
      return {
        sig: `rev|${g.rkey}|${alive}|${g.revived}|${aliveCount()}|${myPick}`,
        html: `
          <div class="meta"><span class="cat">${roundLabel}</span><span>결과 공개</span></div>
          <div class="intro">
            ${playedNow
              ? `<div class="vs">
                  <div class="pop"><div class="who">관리자</div><div class="e">${HANDS[g.hand]?.emoji ?? "?"}</div><div class="nm">${HANDS[g.hand]?.name ?? ""}</div></div>
                  <i>VS</i>${mine}
                </div>`
              : `<p class="who" style="color:var(--muted);margin:0">관리자</p><div class="vs" style="grid-template-columns:1fr"><div class="pop"><div class="e">${HANDS[g.hand]?.emoji ?? "?"}</div><div class="nm">${HANDS[g.hand]?.name ?? ""}</div></div></div>`}
            ${resHtml}
            <div class="stats">
              ${ORDER.map((h) => `<span>${HANDS[h].emoji} <b>${st[h] ?? 0}</b>명</span>`).join("")}
              <span>생존 <b>${aliveCount()}</b>명</span>
            </div>
            <p style="margin-top:20px">${alive ? "다음 라운드를 기다려 주세요." : ""}</p>
          </div>`,
      };
    }
    case "ended": {
      const winners = playerList().filter((p) => p.alive).map((p) => p.name).sort();
      return {
        sig: `end|${g.gameId}|${winners.join(",")}`,
        html: `
          <div class="intro">
            <p class="big">${alive ? "🏆" : "🏁"}</p>
            <h2>${alive ? "최종 생존!" : "게임 종료"}</h2>
            <p>${winners.length ? `최종 생존자 ${winners.length}명` : "생존자가 없어요"}</p>
            <div class="chips">${winners.map((n) => `<span class="chip win">${esc(n)}</span>`).join("")}</div>
          </div>`,
      };
    }
    default: // lobby
      return {
        sig: `lobby|${g.gameId}|${playerList().length}|${alive}`,
        html: `
          <div class="intro">
            <p class="big">🙌</p>
            <h2>${esc(player.name)}님 환영해요</h2>
            <p>곧 관리자와의 가위바위보가 시작돼요. 화면을 켜 두세요.<br>현재 참가자 <b style="color:var(--fg)">${playerList().length}</b>명</p>
          </div>`,
      };
  }
}

function render() {
  if (!configured) return;
  $me.innerHTML = me && player ? `<b>${esc(player.name)}</b> · ${player.alive ? "생존" : "탈락"}` : "";
  const v = view();
  if (v.sig === lastSig) return;
  lastSig = v.sig;
  $main.innerHTML = v.html;
  v.after?.();
  tick();
}

function tick() {
  const $t = document.getElementById("timer");
  if (!$t || game?.status !== "pick") return;
  const $b = document.getElementById("bar");
  if (!game.deadline) { $t.textContent = "제한시간 없음"; if ($b) $b.style.width = "100%"; return; }
  const left = Math.max(0, game.deadline - serverNow());
  $t.textContent = left > 0 ? `${Math.ceil(left / 1000)}초` : "시간 종료";
  if ($b) $b.style.width = (100 * left / ((game.duration || 1) * 1000)).toFixed(1) + "%";
  if (left <= 0) {
    $main.querySelectorAll("[data-h]").forEach((b) => (b.disabled = true));
    const el = document.getElementById("hint");
    if (el && !el.dataset.done) { el.dataset.done = 1; el.innerHTML = myPick ? `<b>${handLabel(myPick)}</b> 제출 완료 · 결과를 기다려요` : "시간이 끝났어요"; }
  }
}
</script>
</body>
</html>
