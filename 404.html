<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요</title>
<script>
// 주소를 조금 틀려도(대소문자, movie/ 누락, 끝에 / 등) 맞는 페이지로 보낸다.
(function () {
  var p = decodeURIComponent(location.pathname).toLowerCase();
  var rest = location.search + location.hash;
  var to = null;
  var admin = p.indexOf("admin") !== -1 || p.indexOf("관리자") !== -1;
  if (p.indexOf("rps") !== -1 || p.indexOf("가위") !== -1) to = admin ? "/rps/admin.html" : "/rps/";
  else if (/(^|\/)ox(\/|$)/.test(p)) to = admin ? "/ox/admin.html" : "/ox/";
  else if (p.indexOf("chosung") !== -1 || p.indexOf("초성") !== -1) to = admin ? "/chosung/admin.html" : "/chosung/";
  else if (admin) to = "/movie/admin.html";
  else if (p.indexOf("movie") !== -1 || p.indexOf("영화") !== -1) to = "/movie/";
  else if (p.indexOf("quiz") !== -1 || p.indexOf("퀴즈") !== -1) to = "/quiz.html";
  if (to && to !== location.pathname) location.replace(to + rest);
})();
</script>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#1d1d1f;color:#f4f4f5;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:16px;text-align:center;line-height:1.6}
h1{font-size:56px;margin:0;color:#fd2155}
p{color:#8d8d96}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
a{color:#f4f4f5;text-decoration:none;border:1px solid #34343a;border-radius:999px;padding:10px 18px}
a:hover{border-color:#08fdd8;color:#08fdd8}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>페이지를 찾을 수 없어요. 주소를 확인해 주세요.</p>
  <nav>
    <a href="/">홈</a>
    <a href="/movie/">🎬 이모지 영화 맞추기</a>
    <a href="/chosung/">🔤 초성 영화 퀴즈</a>
    <a href="/ox/">⭕ OX 서바이벌</a>
    <a href="/rps/">✌️ 가위바위보 서바이벌</a>
    <a href="/quiz.html">🤔 이모지 퀴즈</a>
  </nav>
</main>
</body>
</html>
